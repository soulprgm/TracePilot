services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: tracepilot-otel-collector

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

    environment:
      OTEL_GRPC_ENDPOINT: 0.0.0.0:4317
      OTEL_HTTP_ENDPOINT: 0.0.0.0:4318
      JAEGER_HOST: jaeger
      TRACEPILOT_HOSTPORT: host.docker.internal:8080

    ports:
      - "4317:4317"
      - "4318:4318"

    depends_on:
      - jaeger


  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: tracepilot-jaeger

    ports:
      - "16686:16686"
      - "4317"
      - "4318"
