services:
  - type: web
    name: tracepilot-backend
    runtime: docker
    plan: free
    rootDir: tracepilot-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: tracepilot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tracepilot-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tracepilot-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: tracepilot-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tracepilot-db
          property: password
      - key: JAEGER_URL
        value: https://tracepilot-jaeger.onrender.com
      - key: ORDER_SERVICE_URL
        value: https://tracepilot-order.onrender.com
      - key: TRACE_RETENTION_DAYS
        value: 30
      - key: TRACEPILOT_AI_ENABLED
        value: true
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: TRACEPILOT_AI_MAX_REQUESTS_PER_HOUR
        value: 30
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: tracepilot-jaeger
    runtime: docker
    plan: free
    rootDir: jaeger
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /

  - type: web
    name: tracepilot-collector
    runtime: docker
    plan: free
    rootDir: otel-collector
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: OTEL_GRPC_ENDPOINT
        value: 0.0.0.0:4317
      - key: OTEL_HTTP_ENDPOINT
        value: 0.0.0.0:10000
      - key: TRACEPILOT_URL
        value: https://tracepilot-backend.onrender.com
      - key: JAEGER_URL
        value: https://tracepilot-jaeger.onrender.com

  - type: web
    name: tracepilot-inventory
    runtime: docker
    plan: free
    rootDir: inventory-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: OTEL_SERVICE_NAME
        value: inventory-service
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_LOGS_EXPORTER
        value: none
      - key: OTEL_METRICS_EXPORTER
        value: none
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://tracepilot-collector.onrender.com

  - type: web
    name: tracepilot-payment
    runtime: docker
    plan: free
    rootDir: payment_service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: OTEL_SERVICE_NAME
        value: payment-service
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_LOGS_EXPORTER
        value: none
      - key: OTEL_METRICS_EXPORTER
        value: none
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://tracepilot-collector.onrender.com

  - type: web
    name: tracepilot-order
    runtime: docker
    plan: free
    rootDir: order_service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: OTEL_SERVICE_NAME
        value: order-service
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_LOGS_EXPORTER
        value: none
      - key: OTEL_METRICS_EXPORTER
        value: none
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://tracepilot-collector.onrender.com
      - key: INVENTORY_SERVICE_URL
        value: https://tracepilot-inventory.onrender.com
      - key: PAYMENT_SERVICE_URL
        value: https://tracepilot-payment.onrender.com

databases:
  - name: tracepilot-db
    plan: free
    databaseName: tracepilot
    user: tracepilot
