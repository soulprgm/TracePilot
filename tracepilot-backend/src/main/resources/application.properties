spring.application.name=tracepilot-backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tracepilot}
spring.datasource.username=${DB_USER:tracepilot}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

tracepilot.jaeger-url=${JAEGER_URL:http://localhost:16686}
tracepilot.order-url=${ORDER_SERVICE_URL:http://localhost:8081}
tracepilot.retention-days=${TRACE_RETENTION_DAYS:30}
tracepilot.ai.enabled=${TRACEPILOT_AI_ENABLED:true}
tracepilot.ai.api-key=${OPENAI_API_KEY:}
tracepilot.ai.model=${OPENAI_MODEL:gpt-6-luna}
tracepilot.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
tracepilot.ai.timeout-seconds=${TRACEPILOT_AI_TIMEOUT_SECONDS:25}
tracepilot.ai.max-requests-per-hour=${TRACEPILOT_AI_MAX_REQUESTS_PER_HOUR:30}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
server.forward-headers-strategy=framework
