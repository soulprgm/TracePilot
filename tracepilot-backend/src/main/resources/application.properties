spring.application.name=tracepilot-backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tracepilot}
spring.datasource.username=${DB_USER:tracepilot}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

tracepilot.jaeger-url=${JAEGER_URL:http://localhost:16686}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
server.forward-headers-strategy=framework
